name: gbp2-cache
on:
  push:
    branches: ['servi/proof-gbp2-cache']
jobs:
  proof:
    name: proof (${{ matrix.mode }}-${{ matrix.i }})
    strategy:
      fail-fast: false
      matrix:
        mode: [lag, fg, saturate]
        i: [1, 2]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Protect the app data folder as the app does on first start
        shell: powershell
        run: .\tools\scripts\Initialize-CiDataFolder.ps1
      - name: Force
        shell: powershell
        run: .\.github\forced\Force-Governor.ps1 -Mode ${{ matrix.mode }} -Rounds 4
