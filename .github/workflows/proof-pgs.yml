name: Proof protected sessions
on:
  push:
    branches: ['servi/proof-pgs']
permissions:
  contents: read
jobs:
  pgs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: base-a
            sha: 168857dbafe78df15b36b1c3b73abce14efa6729
          - lane: base-b
            sha: 168857dbafe78df15b36b1c3b73abce14efa6729
          - lane: head-a
            sha: 58283727b165a31a096432d20214aeb4196557c6
          - lane: head-b
            sha: 58283727b165a31a096432d20214aeb4196557c6
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r tools/validation/requirements.txt
      - name: Protect the app data folder as the app does on first start
        shell: powershell
        run: .\tools\scripts\Initialize-CiDataFolder.ps1
      - name: Protected sessions x12
        shell: powershell
        run: |
          $failed = 0
          foreach ($i in 1..12) {
            $out = .\tools\scripts\Test-Baseline.ps1 -TestName Test-ProtectedGameSessions.ps1 6>&1 | Out-String
            $path = [regex]::Match($out, 'Summary: (\S+summary\.json)').Groups[1].Value
            $latest = Get-Item (Split-Path $path -Parent)
            $summary = Get-Content $path -Raw | ConvertFrom-Json
            $ok = $summary.failedCount -eq 0
            if (-not $ok) { $failed++ }
            Write-Host ("RUN $i " + $(if ($ok) { 'pass' } else { 'FAIL' }))
            if (-not $ok) { Get-Content (Join-Path $latest.FullName 'Test-ProtectedGameSessions.stderr.log') | Where-Object { $_ -notlike '#<*' } | Select-Object -First 4 | ForEach-Object { Write-Host "  $_" } }
          }
          Write-Host "SCORE failed runs: $failed of 12"
