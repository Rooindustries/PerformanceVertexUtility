name: Baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: [self-hosted, laptop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/validation/requirements.txt
      - run: python tools/validation/check_baseline.py
  python-tests:
    runs-on: [self-hosted, laptop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/validation -p 'test_*.py'
  powershell:
    runs-on: [self-hosted, laptop]
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: Parse and check Windows PowerShell 5.1 syntax
        shell: pwsh
        run: ./tools/validation/check_powershell.ps1
  dotnet-build:
    runs-on: [self-hosted, laptop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python tools/validation/build_dotnet.py
  windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.HOSTED_WINDOWS_CI == 'true')
    name: windows (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: governor
            arguments: -TestName Test-GovernorScenarios.ps1
          - shard: suites-1
            arguments: -ExcludeTestName Test-GovernorScenarios.ps1 -ShardCount 2 -ShardIndex 0 -BuildFrontend
          - shard: suites-2
            arguments: -ExcludeTestName Test-GovernorScenarios.ps1 -ShardCount 2 -ShardIndex 1
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r tools/validation/requirements.txt
      - name: Protect the app data folder as the app does on first start
        shell: powershell
        run: .\tools\scripts\Initialize-CiDataFolder.ps1
      - name: Backend regression suite
        shell: powershell
        run: .\tools\scripts\Test-Baseline.ps1 ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation-${{ matrix.shard }}
          path: artifacts/validation/
